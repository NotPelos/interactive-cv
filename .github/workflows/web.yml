name: Web — CI

on:
  # Sin path filter en push a main: el contenido vive en el repo privado
  # cv-content y los "deploy commits" en este repo público son a menudo
  # empty commits que no tocan apps/web. Cualquier push a main dispara CI
  # + deploy. PR sigue con path filter para no quemar minutos en
  # cambios que no afectan al web.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

# Cancela runs anteriores del mismo PR para no quemar minutos
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Typecheck · Build · Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cv-content (private repo con datos personales)
        uses: actions/checkout@v4
        with:
          repository: NotPelos/cv-content
          token: ${{ secrets.CV_CONTENT_PAT }}
          path: personal

      - name: Habilitar corepack (pnpm)
        run: corepack enable

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Sync contenido personal a apps/web
        # Copia personal/content → src/content, regenera profile.ts, avatares y OG.
        # Necesario ANTES de typecheck porque src/profile.ts es gitignored.
        run: pnpm --filter web sync

      - name: Instalar Typst
        # Se instala en /usr/local/bin, disponible como `typst` en el PATH.
        # Versión bundleada con el repo para render determinístico entre runs.
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Generar CV PDFs (cv-es.pdf + cv-en.pdf)
        # Lee el contenido ya sincronizado + fuentes en scripts/cv-pdf/fonts/
        # y produce cv-{es,en}.pdf en apps/web/public/ para que el build de
        # Astro los recoja como estáticos.
        run: pnpm --filter web cv:pdf

      - name: Typecheck (astro check)
        run: pnpm --filter web typecheck

      - name: Lint (ESLint --max-warnings 0)
        run: pnpm --filter web lint

      - name: Build (astro build)
        # PUBLIC_* env vars se inyectan en el bundle (Astro las lee en build time).
        env:
          PUBLIC_WORKER_URL: "https://notpelos-api.xpelos23.workers.dev"
          PUBLIC_API_URL: "https://notpelos-cv-api.fly.dev"
        run: pnpm --filter web build

      - name: Audit de dependencias (nivel critical, solo prod)
        # Solo prod deps (--prod), y gate en CRITICAL: los HIGH que ha registrado
        # npm en 2026 en la cadena transitiva de Astro (svgo, fast-uri) son
        # build-time only y no llegan al bundle estático servido a los usuarios.
        # Mantengo el step para bloquear si aparece algo realmente crítico.
        run: pnpm audit --prod --audit-level=critical

      - name: Upload dist como artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  deploy:
    name: Deploy a Cloudflare Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy a Cloudflare Pages (notpelos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy apps/web/dist --project-name=notpelos --branch=main --commit-dirty=true
