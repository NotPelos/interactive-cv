server:
  port: 8080

spring:
  application:
    name: interactive-cv-api

# App-specific config. ALLOWED_ORIGIN env var override (set via flyctl secrets)
# para poder cambiar el dominio sin redeploy. Default apunta al sitio actual.
app:
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:https://notpelos.pages.dev}

# Cloudflare Turnstile — CAPTCHA invisible. Site key va en el bundle público
# (Astro PUBLIC_TURNSTILE_SITE_KEY); secret solo en el server. Sin secret,
# TurnstileVerifier rechaza todas las peticiones (fail-closed).
turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}

# Resend — proveedor de email transaccional. Api key es secreta.
# `from` puede ser onboarding@resend.dev (sandbox de Resend, sin verificar dominio)
# o algo como "NotPelos <hi@notpelos.dev>" cuando haya dominio verificado.
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:onboarding@resend.dev}

# Destino de los mensajes del formulario de contacto.
contact:
  to: ${CONTACT_TO_EMAIL:}

# Actuator — expose only health and info, never env/beans/mappings
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

# OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    dev.notpelos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
