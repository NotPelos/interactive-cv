# Fly.io app config — interactive-cv backend
# App URL: https://notpelos-cv-api.fly.dev
# Docs: https://fly.io/docs/reference/configuration/

app = "notpelos-cv-api"
primary_region = "cdg"   # París (mad/Madrid está deprecada en Fly.io 2026)

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  # ALLOWED_ORIGIN se inyecta via `flyctl secrets set` (no hardcoded aquí)
  # para poder rotarlo sin redeploy.
  # Secrets adicionales que consume el formulario de contacto (POST /api/contact):
  #   TURNSTILE_SECRET_KEY     — de dash.cloudflare.com/?to=/:account/turnstile
  #   RESEND_API_KEY           — de resend.com/api-keys
  #   RESEND_FROM              — opcional; default onboarding@resend.dev
  #   CONTACT_TO_EMAIL         — donde reciben los mensajes del formulario
  # Sin cualquiera de los tres primeros, /api/contact devuelve 403 o 502.
  # Adaptador IA (POST /api/cv/adapt):
  #   GEMINI_API_KEY           — de aistudio.google.com/apikey
  # Sin ella /api/cv/adapt devuelve 502 upstream_failed.

[http_service]
  internal_port = 8080
  force_https = true
  # Auto-stop dentro del crédito mensual gratis ($5/mes).
  # Cold start ~5-10s pero el frontend tiene fallback estático para /api/cv/pdf
  # mientras el contenedor se levanta.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"      # tiempo de warmup de la JVM
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"            # JVM tuneada con -Xmx384m + MaxRAMPercentage=75
  cpu_kind = "shared"
  cpus = 1
